<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="stylesheet" href="main.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="flex">
    <div class="wrapper">
      <div class="container">
        <div class="header">
          <h1 class="title">
            <span>Q</span>
            <span>U</span>
            <span>I</span>
            <span>Z</span>
          </h1>
          <div class="score-container">
            <span id="right-score"></span>/<span id="total-questions"></span>
          </div>
        </div>
        <div class="body">
          <!-- remove comments -->
          <h2 class="quiz-question" id="question">
            <!--What is the full form of HTTP?<br><span class="category">Geography</span> -->
          </h2>
          <ul class="options">
            <!--
                    <li>1. Hyper Text Transfer Package</li>
                    <li>1. Hyper Text Transfer Package</li>
                    <li>1. Hyper Text Transfer Package</li>
                    <li>1. Hyper Text Transfer Package</li>
                    -->
          </ul>
          <div id="result"></div>
        </div>
        <div class="quiz-button-section">
          <button type="button" id="check-answer">Check Answer!</button>
          <button type="button" id="play-again">Play Again!</button>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
